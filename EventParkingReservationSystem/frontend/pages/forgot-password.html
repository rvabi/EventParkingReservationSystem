<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SmartEvent</title>
    <link rel="stylesheet" href="../css/main.css">
</head>

<body>

    <header id="navbar"></header>

    <main class="auth-page">
        <div class="auth-card login-form-card">

            <div class="auth-status-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="5" width="18" height="14" rx="2" />
                    <path d="M3 7l9 6 9-6" />
                </svg>
            </div>

            <div class="form-heading">
                <span class="eyebrow">Forgot password</span>
                <h2>Reset your password</h2>
                <p>Enter the email associated with your account and we'll send reset instructions.</p>
            </div>

            <div id="globalFeedback" class="feedback" hidden></div>

            <form id="forgotForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input id="email" class="form-control" type="email" placeholder="you@example.com" maxlength="255" required>
                    <span id="emailFeedback" class="field-feedback" hidden></span>
                </div>

                <div class="hero-actions">
                    <button id="forgotButton" class="btn btn-primary" type="submit">Send Reset Link</button>
                </div>
            </form>

            <div id="devHint" class="dev-only-hint" hidden></div>

            <div class="form-footer">
                <a href="login.html" class="link-button">&larr; Back to Login</a>
            </div>

        </div>
    </main>

    <script type="module" src="../js/forgot-password.js"></script>

</body>

</html>
