<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Venue Management | SmartEvent</title>

    <link
        rel="stylesheet"
        href="../css/main.css">
</head>

<body>

    <!-- Shared Navigation -->
    <header id="navbar"></header>


    <main>

        <section class="services-section">

            <div class="section-container">

                <!-- Page Heading -->
                <div class="section-heading">

                    <span class="section-eyebrow">
                        VENUE MANAGEMENT
                    </span>

                    <h2>
                        Manage event venues.
                    </h2>

                    <p>
                        Create, update and manage venue
                        information and capacity.
                    </p>

                </div>


                <!-- Feedback -->
                <div
                    id="globalFeedback"
                    class="feedback"
                    hidden>
                </div>


                <!-- Venue Form -->
                <article class="service-card">

                    <div class="service-icon">
                        V
                    </div>

                    <h3 id="venueFormTitle">
                        Add New Venue
                    </h3>

                    <form id="venueForm">

                        <input
                            id="venueId"
                            type="hidden">


                        <div class="form-group">

                            <label
                                class="form-label"
                                for="venueName">
                                Venue Name
                            </label>

                            <input
                                id="venueName"
                                class="form-control"
                                type="text"
                                maxlength="150"
                                placeholder="Enter venue name"
                                required>

                        </div>


                        <div class="form-group">

                            <label
                                class="form-label"
                                for="venueAddress">
                                Address
                            </label>

                            <textarea
                                id="venueAddress"
                                class="form-control"
                                maxlength="500"
                                placeholder="Enter venue address"
                                required>
                            </textarea>

                        </div>


                        <div class="form-group">

                            <label
                                class="form-label"
                                for="venueCapacity">
                                Total Capacity
                            </label>

                            <input
                                id="venueCapacity"
                                class="form-control"
                                type="number"
                                min="1"
                                placeholder="Enter total capacity"
                                required>

                        </div>


                        <div class="hero-actions">

                            <button
                                id="saveVenueButton"
                                class="btn btn-primary"
                                type="submit">
                                Save Venue
                            </button>

                            <button
                                id="cancelEditButton"
                                class="btn btn-secondary"
                                type="button"
                                hidden>
                                Cancel Edit
                            </button>

                        </div>

                    </form>

                </article>


                <!-- Venue List Heading -->
                <div
                    class="section-heading"
                    style="margin-top: 60px;">

                    <span class="section-eyebrow">
                        AVAILABLE VENUES
                    </span>

                    <h2>
                        Venue list
                    </h2>

                    <p>
                        View existing venues and manage
                        their details.
                    </p>

                </div>


                <!-- Venue List -->
                <div
                    id="venueList"
                    class="service-grid">

                    <!-- Loaded using venues.js -->

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <div class="footer-container">

            <div>

                <strong class="footer-brand">
                    SmartEvent
                </strong>

                <p>
                    Venue and event experience management.
                </p>

            </div>

            <p class="footer-note">
                Smart Event Experience &
                Reservation System
            </p>

        </div>

    </footer>


    <script
        type="module"
        src="../js/venues.js">
    </script>

</body>

</html>
