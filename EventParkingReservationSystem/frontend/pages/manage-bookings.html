<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking Management | SmartEvent</title>

    <link rel="stylesheet" href="../css/main.css">
</head>

<body>

    <div id="authGuardPanel" class="auth-guard-panel" hidden>
        <p id="authGuardMessage"></p>
        <div class="hero-actions">
            <a id="authGuardLink" href="login.html" class="btn btn-primary">Login</a>
        </div>
    </div>

    <div id="adminShell" class="admin-shell" hidden>

        <div id="adminSidebarSlot"></div>

        <div class="admin-main">

            <header class="admin-topbar">
                <button id="adminMenuToggle" class="admin-menu-toggle" type="button" aria-label="Open menu">
                    <span aria-hidden="true">&#9776;</span>
                </button>
                <span class="admin-topbar-brand">SmartEvent Admin</span>
            </header>

            <main class="admin-content">

                <section class="services-section">

                    <div class="section-container">

                        <div class="section-heading">
                            <span class="section-eyebrow">
                                BOOKING MANAGEMENT
                            </span>

                            <h2>
                                Booking Management
                            </h2>

                            <p>
                                Review reservations, booking status and event operations.
                            </p>
                        </div>

                        <div id="globalFeedback" class="feedback" hidden></div>

                        <p id="bookingsLoadingState" class="form-footer-text">
                            Loading bookings...
                        </p>

                        <div id="bookingAdminBody" hidden>

                            <div class="parking-status-summary">
                                <div class="seat-admin-stat">
                                    <span class="seat-admin-stat-label">Total Bookings</span>
                                    <span id="statTotalBookings" class="seat-admin-stat-value">0</span>
                                </div>
                                <div class="seat-admin-stat">
                                    <span class="seat-admin-stat-label">Pending</span>
                                    <span id="statPendingBookings" class="seat-admin-stat-value">0</span>
                                </div>
                                <div class="seat-admin-stat">
                                    <span class="seat-admin-stat-label">Confirmed</span>
                                    <span id="statConfirmedBookings" class="seat-admin-stat-value">0</span>
                                </div>
                                <div class="seat-admin-stat">
                                    <span class="seat-admin-stat-label">Expired</span>
                                    <span id="statExpiredBookings" class="seat-admin-stat-value">0</span>
                                </div>
                                <div class="seat-admin-stat">
                                    <span class="seat-admin-stat-label">Cancelled</span>
                                    <span id="statCancelledBookings" class="seat-admin-stat-value">0</span>
                                </div>
                            </div>

                            <div class="booking-filter-bar">

                                <div class="form-group">
                                    <label class="form-label" for="bookingSearchInput">Search</label>
                                    <input
                                        id="bookingSearchInput"
                                        class="form-control"
                                        type="text"
                                        placeholder="Booking #, ID, customer or event name">
                                </div>

                                <div class="form-group">
                                    <label class="form-label" for="bookingStatusFilter">Status</label>
                                    <select id="bookingStatusFilter" class="form-control">
                                        <option value="">All statuses</option>
                                        <option value="Pending">Pending</option>
                                        <option value="Confirmed">Confirmed</option>
                                        <option value="Cancelled">Cancelled</option>
                                        <option value="Expired">Expired</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label class="form-label" for="bookingEventFilter">Event</label>
                                    <select id="bookingEventFilter" class="form-control">
                                        <option value="">All events</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label class="form-label" for="bookingSortSelect">Sort</label>
                                    <select id="bookingSortSelect" class="form-control">
                                        <option value="newest">Newest first</option>
                                        <option value="oldest">Oldest first</option>
                                        <option value="eventDate">Event date</option>
                                    </select>
                                </div>

                                <button id="clearBookingFiltersButton" type="button" class="btn btn-secondary btn-small">
                                    Clear Filters
                                </button>

                            </div>

                            <div id="bookingActionFeedback" class="feedback" hidden></div>

                            <div id="bookingList" class="booking-list"></div>

                        </div>

                    </div>

                </section>

            </main>

        </div>

    </div>

    <script type="module" src="../js/manage-bookings.js"></script>

</body>

</html>
