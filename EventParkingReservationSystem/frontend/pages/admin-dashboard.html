<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Control Center | SmartEvent</title>

    <link rel="stylesheet" href="../css/main.css">
</head>

<body>

    <div id="authGuardPanel" class="auth-guard-panel" hidden>
        <p id="authGuardMessage"></p>
        <div class="hero-actions">
            <a id="authGuardLink" href="login.html" class="btn btn-primary">Login</a>
        </div>
    </div>

    <div id="adminShell" class="admin-shell" hidden>

        <div id="adminSidebarSlot"></div>

        <div class="admin-main">

            <header class="admin-topbar">
                <button id="adminMenuToggle" class="admin-menu-toggle" type="button" aria-label="Open menu">
                    <span aria-hidden="true">&#9776;</span>
                </button>
                <span class="admin-topbar-brand">SmartEvent Admin</span>
            </header>

            <main class="admin-content">

                <div class="admin-page-header">
                    <span class="admin-eyebrow">SMART EVENT ADMIN CONTROL CENTER</span>
                    <h1 id="adminGreeting" class="admin-page-title">Good day, Admin</h1>
                    <p class="admin-page-subtitle">
                        Manage events, seating and event-day operations from one control center.
                    </p>
                </div>

                <div id="globalFeedback" class="feedback" hidden></div>

                <div class="admin-quick-actions">

                    <a href="manage-events.html" class="admin-quick-action is-primary">
                        <svg class="admin-quick-action-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
                            <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
                        </svg>
                        <span>Create Event</span>
                    </a>

                    <a href="manage-seats.html" class="admin-quick-action">
                        <svg class="admin-quick-action-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="4" y="5" width="6" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="2" />
                            <rect x="14" y="5" width="6" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="2" />
                            <rect x="4" y="15" width="6" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="2" />
                            <rect x="14" y="15" width="6" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="2" />
                        </svg>
                        <span>Manage Seats</span>
                    </a>

                    <a href="manage-bookings.html" class="admin-quick-action">
                        <svg class="admin-quick-action-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3" y="6" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2" />
                            <line x1="3" y1="11" x2="21" y2="11" stroke="currentColor" stroke-width="2" />
                        </svg>
                        <span>View Bookings</span>
                    </a>

                    <a href="manage-customers.html" class="admin-quick-action">
                        <svg class="admin-quick-action-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="2" />
                            <path d="M5 20c0-3.6 3.1-6.4 7-6.4s7 2.8 7 6.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                        <span>Manage Customers</span>
                    </a>

                </div>

                <div id="summaryStrip" class="admin-summary-strip" hidden></div>

                <h2 class="admin-section-title">Event Operations</h2>
                <p class="admin-section-subtitle">Upcoming events, nearest start date first.</p>

                <div id="eventBoard" class="admin-event-board"></div>

            </main>

        </div>

    </div>

    <script type="module" src="../js/admin-dashboard.js"></script>

</body>

</html>
