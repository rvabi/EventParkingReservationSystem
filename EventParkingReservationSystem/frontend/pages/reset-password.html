<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SmartEvent</title>
    <link rel="stylesheet" href="../css/main.css">
</head>

<body>

    <header id="navbar"></header>

    <main class="auth-page">
        <div class="auth-card login-form-card">

            <div id="resetIcon" class="auth-status-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="11" width="14" height="9" rx="2" />
                    <path d="M8 11V8a4 4 0 0 1 8 0v3" />
                </svg>
            </div>

            <div id="resetIntro" class="form-heading">
                <span class="eyebrow">Reset password</span>
                <h2>Choose a new password</h2>
                <p>Enter and confirm your new password below.</p>
            </div>

            <div id="globalFeedback" class="feedback" hidden></div>

            <div id="missingTokenNotice" class="auth-status-block" hidden>
                <p>This reset link is missing a required token. Please request a new password reset link.</p>
                <div class="hero-actions">
                    <a href="forgot-password.html" class="btn btn-secondary">Request New Link</a>
                </div>
            </div>

            <form id="resetForm" novalidate>
                <div class="form-group password-group">
                    <label class="form-label" for="newPassword">New Password</label>
                    <div class="password-field">
                        <input id="newPassword" class="form-control" type="password" placeholder="Create a new password" minlength="8" maxlength="100" required>
                        <button id="newPasswordToggle" type="button" class="password-toggle" aria-label="Show new password">Show</button>
                    </div>
                    <span id="newPasswordFeedback" class="field-feedback" hidden></span>
                </div>

                <div class="form-group password-group">
                    <label class="form-label" for="confirmPassword">Confirm Password</label>
                    <div class="password-field">
                        <input id="confirmPassword" class="form-control" type="password" placeholder="Re-enter your new password" minlength="8" maxlength="100" required>
                        <button id="confirmPasswordToggle" type="button" class="password-toggle" aria-label="Show confirm password">Show</button>
                    </div>
                    <span id="confirmPasswordFeedback" class="field-feedback" hidden></span>
                </div>

                <div class="hero-actions">
                    <button id="resetButton" class="btn btn-primary" type="submit">Reset Password</button>
                </div>
            </form>

            <div id="resetSuccess" class="auth-status-block" hidden>
                <div class="hero-actions">
                    <a href="login.html" class="btn btn-primary">Return to Login</a>
                </div>
            </div>

        </div>
    </main>

    <script type="module" src="../js/reset-password.js"></script>

</body>

</html>
