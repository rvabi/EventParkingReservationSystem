<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SmartEvent</title>
    <link rel="stylesheet" href="../css/main.css">
</head>

<body>

    <header id="navbar"></header>

    <main class="login-shell">

        <div class="login-hero">
            <img
                src="../assets/images/login-hero-bg.png"
                alt="Event venue, seating and parking"
                class="login-hero-image"
            />
        </div>

        <div class="login-form-panel">

            <div class="login-form-card">

                <div class="form-heading">
                    <span class="eyebrow">Sign in</span>
                    <h2>Welcome back</h2>
                    <p>Use your account credentials to access the platform.</p>
                </div>

                <div id="globalFeedback" class="feedback" hidden></div>

                <form id="loginForm" novalidate>

                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input id="email" class="form-control" type="email" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group password-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="password-field">
                            <input id="password" class="form-control" type="password" placeholder="Enter your password" required>
                            <button id="passwordToggle" type="button" class="password-toggle" aria-label="Show password">Show</button>
                        </div>
                    </div>

                    <div class="form-group form-row form-meta-row">
                        <label class="checkbox-label">
                            <input id="rememberMe" type="checkbox">
                            <span>Remember me</span>
                        </label>

                        <a href="forgot-password.html" id="forgotPasswordLink" class="link-button forgot-link">Forgot Password?</a>
                    </div>

                    <div class="hero-actions">
                        <button id="loginButton" class="btn btn-primary" type="submit">Login</button>
                    </div>

                </form>

                <div class="form-footer">
                    <span class="form-footer-text">New here?</span>
                    <a href="register.html" class="btn btn-secondary">Create Account</a>
                </div>

            </div>

        </div>

    </main>

    <script type="module" src="../js/login.js"></script>

</body>

</html>
